{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinic.dbSecret" . }}
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgres.username | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
