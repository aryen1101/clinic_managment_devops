{{- if .Values.ingress.enabled }}
# Routes:  /api, /docs, /health, /ready -> backend     /  -> frontend
# An Ingress is only configuration: an Ingress Controller (ingress-nginx) must be installed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/api" "/docs" "/openapi.json" "/health" "/ready" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "clinic.backend" $ }}
                port: {name: http}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clinic.frontend" . }}
                port: {name: http}
{{- end }}
