apiVersion: v1
kind: ConfigMap
metadata:
  name: clinic-config
  namespace: clinic
data:
  APP_ENV: "ci"
  LOG_LEVEL: "INFO"
  DB_HOST: "clinic-postgres"
  DB_PORT: "5432"
  DB_NAME: "clinic"
---

apiVersion: v1
kind: Secret
metadata:
  name: clinic-db-secret
  namespace: clinic
type: Opaque
stringData:
  DB_USER: "clinic"
  DB_PASSWORD: "clinic"
