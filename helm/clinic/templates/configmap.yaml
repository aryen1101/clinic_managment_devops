apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinic.config" . }}
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DB_HOST: {{ include "clinic.postgres" . | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
